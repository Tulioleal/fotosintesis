apiVersion: apps/v1
kind: Deployment
metadata:
  name: fotosintesis-frontend
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: fotosintesis-frontend
    app.kubernetes.io/part-of: fotosintesis-ai
spec:
  replicas: __FRONTEND_REPLICAS__
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: fotosintesis-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fotosintesis-frontend
        app.kubernetes.io/part-of: fotosintesis-ai
    spec:
      serviceAccountName: fotosintesis-frontend
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: __IMAGE_REGISTRY__/frontend:__FRONTEND_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOME
              value: /tmp
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: fotosintesis-runtime-config
                  key: API_BASE_URL
            - name: NEXT_PUBLIC_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: fotosintesis-runtime-config
                  key: NEXT_PUBLIC_API_BASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET_NAME__
                  key: auth-secret
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: fotosintesis-runtime-config
                  key: AUTH_URL
            - name: AUTH_LIMITER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET_NAME__
                  key: __AUTH_LIMITER_HMAC_SECRET_KEY__
            - name: AUTH_LIMITER_ASSERTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET_NAME__
                  key: __AUTH_LIMITER_ASSERTION_SECRET_KEY__
            - name: AUTH_LIMITER_HMAC_KEY_VERSION
              valueFrom:
                configMapKeyRef:
                  name: fotosintesis-runtime-config
                  key: AUTH_LIMITER_HMAC_KEY_VERSION
            - name: AUTH_LIMITER_TRUSTED_FORWARDED_HOPS
              valueFrom:
                configMapKeyRef:
                  name: fotosintesis-runtime-config
                  key: AUTH_LIMITER_TRUSTED_FORWARDED_HOPS
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: __FRONTEND_CPU_REQUEST__
              memory: __FRONTEND_MEM_REQUEST__
            limits:
              cpu: __FRONTEND_CPU_LIMIT__
              memory: __FRONTEND_MEM_LIMIT__
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fotosintesis-frontend
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: fotosintesis-frontend
    app.kubernetes.io/part-of: fotosintesis-ai
  # GKE does not automatically add the NEG annotation when network policy
  # enforcement is enabled. It is required so the Ingress keeps container-native
  # load balancing (GFE -> Pod directly) and the NetworkPolicy only needs to
  # allow the GFE health-check probe ranges, not every node IP.
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: __FRONTEND_SERVICE_TYPE__
  selector:
    app.kubernetes.io/name: fotosintesis-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
