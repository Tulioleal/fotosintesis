apiVersion: batch/v1
kind: Job
metadata:
  name: fotosintesis-migrations
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: fotosintesis-migrations
    app.kubernetes.io/part-of: fotosintesis-ai
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fotosintesis-migrations
        app.kubernetes.io/part-of: fotosintesis-ai
        iam.gke.io/workload-identity: fotosintesis-backend
    spec:
      restartPolicy: Never
      serviceAccountName: fotosintesis-backend
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # A native sidecar exits with the Pod after Alembic, allowing the Job to
      # reach Complete without workflow-managed deletion.
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: __CLOUD_SQL_PROXY_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - "--structured-logs"
            - "--port=__CLOUD_SQL_PROXY_PORT__"
            - "__CLOUD_SQL_INSTANCE_CONNECTION_NAME__"
          ports:
            - name: cloudsql
              containerPort: __CLOUD_SQL_PROXY_PORT__
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: __PROXY_CPU_REQUEST__
              memory: __PROXY_MEM_REQUEST__
            limits:
              cpu: __PROXY_CPU_LIMIT__
              memory: __PROXY_MEM_LIMIT__
      containers:
        - name: migrations
          image: __IMAGE_REGISTRY__/backend:__BACKEND_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - exec /app/scripts/run-migrations.sh __CLOUD_SQL_PROXY_PORT__
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET_NAME__
                  key: __DATABASE_URL_SECRET_KEY__
            - name: OBJECT_STORAGE_PROVIDER
              value: __OBJECT_STORAGE_PROVIDER__
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: __MIGRATION_CPU_REQUEST__
              memory: __MIGRATION_MEM_REQUEST__
            limits:
              cpu: __MIGRATION_CPU_LIMIT__
              memory: __MIGRATION_MEM_LIMIT__
      volumes:
        - name: tmp
          emptyDir: {}
